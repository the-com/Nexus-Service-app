<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NEXUS CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a0c;
    --panel:#131316;
    --panel-2:#1a1a1e;
    --border:#26262b;
    --red:#8a3238;
    --red-bright:#b3474e;
    --text:#f2f0ec;
    --muted:#8b8b93;
    --online:#3fae6a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--panel-2);border-radius:8px;}

  /* ---------- HEADER ---------- */
  header{
    background:#0d0d0f;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:3px;
    color:#fff;
    line-height:1;
  }
  .brand-mark span{color:var(--red-bright);}
  .room-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    padding:4px 10px;
    border-radius:6px;
    letter-spacing:1px;
  }
  .header-right{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    width:36px;height:36px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:.15s;
  }
  .icon-btn:hover{background:var(--panel-2);border-color:var(--red);}
  .invite-btn{
    background:var(--red);
    border:none;color:#fff;
    font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:.15s;
  }
  .invite-btn:hover{background:var(--red-bright);}

  /* ---------- VOICE BAR ---------- */
  #voice-bar{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:10px 20px;
    display:flex;align-items:center;gap:14px;
    flex-shrink:0;flex-wrap:wrap;
  }
  .voice-label{
    display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.5px;text-transform:uppercase;
  }
  .voice-dot{width:7px;height:7px;border-radius:50%;background:var(--online);}
  #voice-members{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .voice-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:20px;padding:4px 10px 4px 4px;
    font-size:12.5px;transition:.15s;
  }
  .voice-chip.speaking{border-color:var(--online);box-shadow:0 0 0 2px rgba(63,174,106,.25);}
  .voice-chip .mini-avatar{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:11px;color:#fff;flex-shrink:0;
  }
  .voice-chip .muted-icon{color:var(--red-bright);font-size:11px;}
  #voice-join-btn{
    background:var(--online);border:none;color:#fff;
    font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;
    margin-left:auto;
  }
  #voice-join-btn:hover{opacity:.85;}
  #voice-join-btn.active{background:var(--red);}
  #voice-mute-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.15s;display:none;
  }
  #voice-mute-btn.muted{border-color:var(--red);color:var(--red-bright);}

  /* ---------- MESSAGES ---------- */
  #messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg{display:flex;gap:12px;max-width:720px;}
  .avatar{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;
    flex-shrink:0;
  }
  .msg-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .msg-meta{display:flex;align-items:baseline;gap:8px;}
  .msg-nick{font-weight:700;font-size:14px;}
  .msg-time{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .msg-text{font-size:14.5px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .msg-file{
    margin-top:4px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:10px;
    overflow:hidden;
    max-width:320px;
  }
  .msg-file img{width:100%;display:block;max-height:280px;object-fit:cover;cursor:pointer;}
  .msg-file-link{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;color:var(--text);text-decoration:none;
  }
  .msg-file-link:hover{background:var(--panel-2);}
  .file-ext{
    background:var(--red);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;padding:4px 6px;border-radius:5px;
  }
  .empty-state{
    margin:auto;text-align:center;color:var(--muted);
  }
  .empty-state .big{
    font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;
    color:var(--panel-2);
  }

  /* ---------- INPUT BAR ---------- */
  #composer{
    border-top:1px solid var(--border);
    background:#0d0d0f;
    padding:14px 20px;
    display:flex;
    align-items:flex-end;
    gap:10px;
    flex-shrink:0;
  }
  #preview-row{
    display:flex;gap:8px;padding:0 20px;flex-wrap:wrap;
  }
  .preview-chip{
    background:var(--panel);border:1px solid var(--red);
    border-radius:8px;padding:6px 10px;font-size:12px;
    display:flex;align-items:center;gap:8px;color:var(--text);
  }
  .preview-chip button{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;
  }
  #text-input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:10px;
    resize:none;
    max-height:140px;
    outline:none;
  }
  #text-input:focus{border-color:var(--red);}
  #send-btn{
    background:var(--red);border:none;color:#fff;
    width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:.15s;
  }
  #send-btn:hover{background:var(--red-bright);}
  #send-btn:disabled{opacity:.4;cursor:default;}
  #file-input{display:none;}

  /* ---------- NICKNAME MODAL ---------- */
  #nick-overlay{
    position:fixed;inset:0;background:rgba(5,5,6,.85);
    width:100vw;height:100vh;height:100dvh;
    display:flex;align-items:center;justify-content:center;
    z-index:50;backdrop-filter:blur(4px);
    overflow-y:auto;padding:20px;
  }
  #nick-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:32px;width:340px;
    text-align:center;
  }
  #nick-card .brand-mark{font-size:32px;margin-bottom:6px;}
  #nick-card p{color:var(--muted);font-size:13px;margin-bottom:22px;}
  #nick-input{
    width:100%;background:var(--void);border:1px solid var(--border);
    color:var(--text);font-size:15px;padding:12px 14px;border-radius:10px;
    outline:none;margin-bottom:14px;text-align:center;font-family:'Inter',sans-serif;
  }
  #nick-input:focus{border-color:var(--red);}
  #nick-go{
    width:100%;background:var(--red);border:none;color:#fff;
    font-weight:700;font-size:14px;padding:12px;border-radius:10px;
    cursor:pointer;letter-spacing:.5px;
  }
  #nick-go:hover{background:var(--red-bright);}

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--red);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;transition:.25s;pointer-events:none;z-index:60;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:600px){
    .brand-mark{font-size:20px;}
    #messages{padding:14px;}
    #composer{padding:10px 14px;}
  }
</style>
</head>
<body>

<div id="nick-overlay">
  <div id="nick-card">
    <div class="brand-mark">NEXUS<span>CHAT</span></div>
    <p>ตั้งชื่อที่จะแสดงในห้องนี้</p>
    <input id="nick-input" maxlength="20" placeholder="ชื่อเล่นของคุณ" autocomplete="off">
    <button id="nick-go">เข้าห้อง</button>
  </div>
</div>

<header>
  <div class="brand">
    <div class="brand-mark">NEXUS<span>CHAT</span></div>
    <div class="room-chip" id="room-chip">ROOM · ------</div>
  </div>
  <div class="header-right">
    <button class="invite-btn" id="invite-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
      คัดลอกลิงก์เชิญ
    </button>
  </div>
</header>

<div id="voice-bar">
  <div class="voice-label"><span class="voice-dot"></span>ห้องเสียง</div>
  <div id="voice-members"></div>
  <button id="voice-mute-btn" title="ปิด/เปิดไมค์">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
  </button>
  <button id="voice-join-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    <span id="voice-join-label">เข้าร่วมเสียง</span>
  </button>
</div>

<div id="messages">
  <div class="empty-state">
    <div class="big">0000</div>
    <div>ยังไม่มีข้อความในห้องนี้ — เริ่มคุยกันได้เลย</div>
  </div>
</div>

<div id="preview-row"></div>
<div id="composer">
  <button class="icon-btn" id="attach-btn" title="แนบไฟล์/รูป">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
  </button>
  <input type="file" id="file-input" multiple>
  <textarea id="text-input" placeholder="พิมพ์ข้อความ..." rows="1"></textarea>
  <button id="send-btn" disabled>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
  </button>
</div>

<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDte8cKae4Dv2oRY9cD7w2wEVZZ60UQBlE",
  authDomain: "nexuschat-c7cea.firebaseapp.com",
  projectId: "nexuschat-c7cea",
  storageBucket: "nexuschat-c7cea.firebasestorage.app",
  messagingSenderId: "610737506814",
  appId: "1:610737506814:web:64e0a0bcb95afcf79358af",
  measurementId: "G-JGFQ20F92K"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// ---------- ROOM ----------
function makeRoomId(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}
const params = new URLSearchParams(location.search);
let roomId = params.get('room');
if(!roomId){
  roomId = makeRoomId();
  const url = new URL(location.href);
  url.searchParams.set('room', roomId);
  history.replaceState({}, '', url);
}
document.getElementById('room-chip').textContent = 'ROOM · ' + roomId;

// ---------- NICKNAME ----------
const AVATAR_COLORS = ['#8a3238','#b3474e','#3f6bae','#3fae6a','#ae8f3f','#7a3fae','#3faeae'];
function colorFor(str){
  let h=0; for(const c of str) h = c.charCodeAt(0) + ((h<<5)-h);
  return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];
}
let myNick = localStorage.getItem('nexuschat_nick');
const overlay = document.getElementById('nick-overlay');
const nickInput = document.getElementById('nick-input');
if(myNick){
  overlay.style.display='none';
} else {
  nickInput.focus();
}
document.getElementById('nick-go').onclick = joinWithNick;
nickInput.addEventListener('keydown', e=>{ if(e.key==='Enter') joinWithNick(); });
function joinWithNick(){
  const v = nickInput.value.trim();
  if(!v) return;
  myNick = v;
  localStorage.setItem('nexuschat_nick', v);
  overlay.style.display='none';
}

// ---------- INVITE ----------
document.getElementById('invite-btn').onclick = ()=>{
  navigator.clipboard.writeText(location.href).then(()=>showToast('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย'));
};
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- MESSAGES ----------
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const fileInput = document.getElementById('file-input');
const previewRow = document.getElementById('preview-row');
let pendingFiles = [];

textInput.addEventListener('input', ()=>{
  textInput.style.height='auto';
  textInput.style.height = Math.min(textInput.scrollHeight,140)+'px';
  updateSendState();
});
textInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById('attach-btn').onclick = ()=> fileInput.click();
fileInput.addEventListener('change', ()=>{
  pendingFiles = [...pendingFiles, ...fileInput.files];
  renderPreviews();
  fileInput.value='';
});
function renderPreviews(){
  previewRow.innerHTML='';
  pendingFiles.forEach((f,i)=>{
    const chip = document.createElement('div');
    chip.className='preview-chip';
    chip.innerHTML = `<span>📎 ${f.name}</span>`;
    const btn = document.createElement('button');
    btn.textContent='✕';
    btn.onclick=()=>{ pendingFiles.splice(i,1); renderPreviews(); updateSendState(); };
    chip.appendChild(btn);
    previewRow.appendChild(chip);
  });
  updateSendState();
}
function updateSendState(){
  sendBtn.disabled = !(textInput.value.trim() || pendingFiles.length);
}
sendBtn.onclick = sendMessage;

async function sendMessage(){
  if(!myNick){ overlay.style.display='flex'; nickInput.focus(); return; }
  const text = textInput.value.trim();
  const files = [...pendingFiles];
  if(!text && !files.length) return;
  textInput.value=''; textInput.style.height='auto';
  pendingFiles = []; renderPreviews();
  sendBtn.disabled = true;

  const attachments = [];
  for(const f of files){
    try{
      const path = `uploads/${roomId}/${Date.now()}_${f.name}`;
      const ref = storage.ref(path);
      await ref.put(f);
      const url = await ref.getDownloadURL();
      attachments.push({url, name:f.name, type:f.type});
    }catch(err){
      console.error(err);
      showToast('อัปโหลดไฟล์ล้มเหลว: '+f.name);
    }
  }

  await db.collection('rooms').doc(roomId).collection('messages').add({
    nick: myNick,
    text: text,
    attachments: attachments,
    color: colorFor(myNick),
    ts: firebase.firestore.FieldValue.serverTimestamp()
  });
}

let firstLoad = true;
db.collection('rooms').doc(roomId).collection('messages')
  .orderBy('ts','asc')
  .onSnapshot(snap=>{
    messagesEl.innerHTML='';
    if(snap.empty){
      messagesEl.innerHTML = `<div class="empty-state"><div class="big">0000</div><div>ยังไม่มีข้อความในห้องนี้ — เริ่มคุยกันได้เลย</div></div>`;
      return;
    }
    snap.forEach(doc=>{
      const m = doc.data();
      messagesEl.appendChild(renderMessage(m));
    });
    if(firstLoad){ scrollBottom(); firstLoad=false; }
    else scrollBottom();
  });

function scrollBottom(){
  requestAnimationFrame(()=>{ messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function renderMessage(m){
  const row = document.createElement('div');
  row.className='msg';

  const avatar = document.createElement('div');
  avatar.className='avatar';
  avatar.style.background = m.color || '#8a3238';
  avatar.textContent = (m.nick||'?').slice(0,2).toUpperCase();

  const body = document.createElement('div');
  body.className='msg-body';

  const meta = document.createElement('div');
  meta.className='msg-meta';
  const nickEl = document.createElement('span');
  nickEl.className='msg-nick';
  nickEl.style.color = m.color || '#fff';
  nickEl.textContent = m.nick || 'ไม่ทราบชื่อ';
  const timeEl = document.createElement('span');
  timeEl.className='msg-time';
  timeEl.textContent = m.ts && m.ts.toDate ? m.ts.toDate().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';
  meta.appendChild(nickEl); meta.appendChild(timeEl);
  body.appendChild(meta);

  if(m.text){
    const textEl = document.createElement('div');
    textEl.className='msg-text';
    textEl.textContent = m.text;
    body.appendChild(textEl);
  }

  (m.attachments||[]).forEach(att=>{
    const card = document.createElement('div');
    card.className='msg-file';
    if(att.type && att.type.startsWith('image/')){
      const img = document.createElement('img');
      img.src = att.url;
      img.onclick = ()=> window.open(att.url,'_blank');
      card.appendChild(img);
    } else {
      const ext = (att.name.split('.').pop()||'FILE').toUpperCase().slice(0,4);
      card.innerHTML = `<a class="msg-file-link" href="${att.url}" target="_blank" download>
        <span class="file-ext">${ext}</span><span>${att.name}</span>
      </a>`;
    }
    body.appendChild(card);
  });

  row.appendChild(avatar);
  row.appendChild(body);
  return row;
}

// ---------- VOICE CHANNEL (WebRTC mesh) ----------
const ICE_CONFIG = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }
]};
const myPeerId = 'p_' + Math.random().toString(36).slice(2,10);
let localStream = null;
let inVoice = false;
let isMuted = false;
const peerConnections = {}; // peerId -> RTCPeerConnection
const remoteAudioEls = {};  // peerId -> <audio>
const analysers = {};       // peerId -> {analyser, data}
let voicePeersUnsub = null;
let voiceSignalsUnsub = null;
let speakingInterval = null;

const voicePeersCol = () => db.collection('rooms').doc(roomId).collection('voicePeers');
const voiceSignalsCol = () => db.collection('rooms').doc(roomId).collection('voiceSignals');

const voiceJoinBtn = document.getElementById('voice-join-btn');
const voiceJoinLabel = document.getElementById('voice-join-label');
const voiceMuteBtn = document.getElementById('voice-mute-btn');
const voiceMembersEl = document.getElementById('voice-members');

voiceJoinBtn.onclick = ()=> inVoice ? leaveVoice() : joinVoice();
voiceMuteBtn.onclick = toggleMute;

async function joinVoice(){
  if(!myNick){ overlay.style.display='flex'; nickInput.focus(); return; }
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    showToast('เปิดไมค์ไม่ได้ — ตรวจสอบสิทธิ์การใช้ไมโครโฟน');
    return;
  }
  inVoice = true;
  voiceJoinBtn.classList.add('active');
  voiceJoinLabel.textContent = 'ออกจากเสียง';
  voiceMuteBtn.style.display = 'flex';
  setupLocalAnalyser();

  // Find who's already here BEFORE announcing myself
  const existingSnap = await voicePeersCol().get();
  const existingIds = new Set(existingSnap.docs.map(d=>d.id));

  await voicePeersCol().doc(myPeerId).set({
    nick: myNick, color: colorFor(myNick), ts: firebase.firestore.FieldValue.serverTimestamp()
  });

  voicePeersUnsub = voicePeersCol().onSnapshot(snap=>{
    snap.docChanges().forEach(change=>{
      const pid = change.doc.id;
      if(pid === myPeerId) return;
      if(change.type === 'added' && !peerConnections[pid]){
        createPeerConnection(pid, existingIds.has(pid));
      }
      if(change.type === 'removed'){
        closePeerConnection(pid);
      }
    });
    renderVoiceMembers(snap);
  });

  voiceSignalsUnsub = voiceSignalsCol().where('to','==',myPeerId).onSnapshot(snap=>{
    snap.docChanges().forEach(async change=>{
      if(change.type === 'added'){
        await handleSignal(change.doc.data());
        change.doc.ref.delete().catch(()=>{});
      }
    });
  });

  speakingInterval = setInterval(updateSpeakingIndicators, 200);
  showToast('เข้าร่วมห้องเสียงแล้ว');
}

async function leaveVoice(){
  inVoice = false;
  voiceJoinBtn.classList.remove('active');
  voiceJoinLabel.textContent = 'เข้าร่วมเสียง';
  voiceMuteBtn.style.display = 'none';
  voiceMuteBtn.classList.remove('muted');
  isMuted = false;

  Object.keys(peerConnections).forEach(closePeerConnection);
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  localStream = null;

  if(voicePeersUnsub) voicePeersUnsub();
  if(voiceSignalsUnsub) voiceSignalsUnsub();
  if(speakingInterval) clearInterval(speakingInterval);
  voiceMembersEl.innerHTML = '';

  try{ await voicePeersCol().doc(myPeerId).delete(); }catch(e){}
}

function toggleMute(){
  if(!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t=> t.enabled = !isMuted);
  voiceMuteBtn.classList.toggle('muted', isMuted);
}

function createPeerConnection(peerId, iAmInitiator){
  const pc = new RTCPeerConnection(ICE_CONFIG);
  peerConnections[peerId] = pc;

  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));

  pc.onicecandidate = e=>{
    if(e.candidate) sendSignal(peerId, 'candidate', JSON.stringify(e.candidate));
  };
  pc.ontrack = e=>{
    let audioEl = remoteAudioEls[peerId];
    if(!audioEl){
      audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      document.body.appendChild(audioEl);
      remoteAudioEls[peerId] = audioEl;
    }
    audioEl.srcObject = e.streams[0];
    setupRemoteAnalyser(peerId, e.streams[0]);
  };

  if(iAmInitiator){
    pc.onnegotiationneeded = async ()=>{
      try{
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal(peerId, 'offer', JSON.stringify(offer));
      }catch(e){ console.error(e); }
    };
  }
  return pc;
}

function closePeerConnection(peerId){
  const pc = peerConnections[peerId];
  if(pc){ pc.close(); delete peerConnections[peerId]; }
  const audioEl = remoteAudioEls[peerId];
  if(audioEl){ audioEl.remove(); delete remoteAudioEls[peerId]; }
  delete analysers[peerId];
}

function sendSignal(to, type, payload){
  voiceSignalsCol().add({
    from: myPeerId, to, type, payload, ts: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function handleSignal(data){
  const { from, type, payload } = data;
  let pc = peerConnections[from];
  if(!pc) pc = createPeerConnection(from, false);
  if(type === 'offer'){
    await pc.setRemoteDescription(JSON.parse(payload));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(from, 'answer', JSON.stringify(answer));
  } else if(type === 'answer'){
    await pc.setRemoteDescription(JSON.parse(payload));
  } else if(type === 'candidate'){
    try{ await pc.addIceCandidate(JSON.parse(payload)); }catch(e){}
  }
}

function renderVoiceMembers(snap){
  voiceMembersEl.innerHTML = '';
  snap.forEach(doc=>{
    const d = doc.data();
    const chip = document.createElement('div');
    chip.className = 'voice-chip';
    chip.dataset.peerId = doc.id;
    chip.innerHTML = `<span class="mini-avatar" style="background:${d.color||'#8a3238'}">${(d.nick||'?').slice(0,2).toUpperCase()}</span><span>${d.nick||'ไม่ทราบชื่อ'}${doc.id===myPeerId?' (คุณ)':''}</span>`;
    voiceMembersEl.appendChild(chip);
  });
}

// ---- speaking indicator via Web Audio analyser ----
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function setupLocalAnalyser(){
  if(!localStream) return;
  const ctx = getAudioCtx();
  const source = ctx.createMediaStreamSource(localStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  analysers[myPeerId] = { analyser, data: new Uint8Array(analyser.frequencyBinCount) };
}
function setupRemoteAnalyser(peerId, stream){
  const ctx = getAudioCtx();
  const source = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  analysers[peerId] = { analyser, data: new Uint8Array(analyser.frequencyBinCount) };
}
function updateSpeakingIndicators(){
  Object.keys(analysers).forEach(peerId=>{
    const { analyser, data } = analysers[peerId];
    analyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0) / data.length;
    const chip = voiceMembersEl.querySelector(`[data-peer-id="${peerId}"]`);
    if(chip) chip.classList.toggle('speaking', avg > 12);
  });
}

window.addEventListener('pagehide', ()=>{
  if(inVoice){ voicePeersCol().doc(myPeerId).delete().catch(()=>{}); }
});
</script>
