<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NEXUS CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a0c;
    --panel:#131316;
    --panel-2:#1a1a1e;
    --border:#26262b;
    --red:#8a3238;
    --red-bright:#b3474e;
    --text:#f2f0ec;
    --muted:#8b8b93;
    --online:#3fae6a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--panel-2);border-radius:8px;}
  .hidden{display:none !important;}
  a{color:inherit;}

  .brand-mark{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    letter-spacing:3px;
    color:#fff;
    line-height:1;
  }
  .brand-mark span{color:var(--red-bright);}

  /* ---------- FULLSCREEN SCREENS (auth / lobby) ---------- */
  .screen{
    position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
    overflow-y:auto;display:flex;flex-direction:column;align-items:center;
    padding:32px 20px;z-index:40;background:var(--void);
  }
  .card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:32px;width:100%;max-width:360px;
  }
  .card h2{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:20px;text-align:center;letter-spacing:.3px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;background:var(--void);border:1px solid var(--border);
    color:var(--text);font-size:14.5px;padding:11px 13px;border-radius:9px;
    outline:none;font-family:'Inter',sans-serif;
  }
  .field input:focus{border-color:var(--red);}
  .btn-primary{
    width:100%;background:var(--red);border:none;color:#fff;
    font-weight:700;font-size:14px;padding:12px;border-radius:10px;
    cursor:pointer;letter-spacing:.3px;margin-top:6px;transition:.15s;
  }
  .btn-primary:hover{background:var(--red-bright);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .switch-line{text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px;}
  .switch-line button{background:none;border:none;color:var(--red-bright);font-weight:700;cursor:pointer;font-size:12.5px;}
  .auth-error{
    background:rgba(138,50,56,.15);border:1px solid var(--red);color:#e8a3a7;
    font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;text-align:center;
  }

  /* ---------- LOBBY ---------- */
  #lobby-screen{gap:0;}
  .lobby-top{
    width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;
    margin-bottom:28px;padding-top:6px;
  }
  .lobby-user{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);}
  .lobby-user .mini-avatar{
    width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:13px;color:#fff;
  }
  .logout-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer;
  }
  .logout-btn:hover{border-color:var(--red);color:var(--text);}
  .lobby-grid{
    width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;
  }
  @media(max-width:600px){ .lobby-grid{grid-template-columns:1fr;} }
  .lobby-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px;
  }
  .lobby-card h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:14px;}
  .lobby-card .row{display:flex;gap:8px;}
  .lobby-card input{
    flex:1;background:var(--void);border:1px solid var(--border);color:var(--text);
    font-size:14px;padding:10px 12px;border-radius:9px;outline:none;font-family:'JetBrains Mono',monospace;
    letter-spacing:1px;
  }
  .lobby-card input:focus{border-color:var(--red);}
  .lobby-card button{
    background:var(--red);border:none;color:#fff;font-weight:700;font-size:13px;
    padding:0 16px;border-radius:9px;cursor:pointer;transition:.15s;
  }
  .lobby-card button:hover{background:var(--red-bright);}
  .recent-title{width:100%;max-width:720px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px;}
  .recent-list{width:100%;max-width:720px;display:flex;flex-direction:column;gap:8px;}
  .recent-item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:.15s;
  }
  .recent-item:hover{border-color:var(--red);background:var(--panel-2);}
  .recent-item .name{font-weight:600;font-size:14px;}
  .recent-item .code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);}
  .empty-recent{color:var(--muted);font-size:13px;text-align:center;padding:20px;}

  /* ---------- CHAT SCREEN ---------- */
  #chat-screen{display:flex;flex-direction:column;height:100%;}
  header{
    background:#0d0d0f;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    flex-shrink:0;
    gap:10px;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .back-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .back-btn:hover{border-color:var(--red);}
  .room-chip{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    padding:4px 10px;
    border-radius:6px;
    letter-spacing:1px;
    white-space:nowrap;
  }
  .header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .icon-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    width:36px;height:36px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:.15s;
  }
  .icon-btn:hover{background:var(--panel-2);border-color:var(--red);}
  .invite-btn{
    background:var(--red);
    border:none;color:#fff;
    font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:.15s;white-space:nowrap;
  }
  .invite-btn:hover{background:var(--red-bright);}

  /* ---------- VOICE BAR ---------- */
  #voice-bar{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:10px 20px;
    display:flex;align-items:center;gap:14px;
    flex-shrink:0;flex-wrap:wrap;
  }
  .voice-label{
    display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.5px;text-transform:uppercase;
  }
  .voice-dot{width:7px;height:7px;border-radius:50%;background:var(--online);}
  #voice-members{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .voice-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:20px;padding:4px 10px 4px 4px;
    font-size:12.5px;transition:.15s;
  }
  .voice-chip.speaking{border-color:var(--online);box-shadow:0 0 0 2px rgba(63,174,106,.25);}
  .voice-chip .mini-avatar{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:11px;color:#fff;flex-shrink:0;
  }
  #voice-join-btn{
    background:var(--online);border:none;color:#fff;
    font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:8px;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;
    margin-left:auto;
  }
  #voice-join-btn:hover{opacity:.85;}
  #voice-join-btn.active{background:var(--red);}
  #voice-mute-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.15s;display:none;
  }
  #voice-mute-btn.muted{border-color:var(--red);color:var(--red-bright);}

  /* ---------- MESSAGES ---------- */
  #messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg{display:flex;gap:12px;max-width:720px;}
  .avatar{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;
    flex-shrink:0;
  }
  .msg-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .msg-meta{display:flex;align-items:baseline;gap:8px;}
  .msg-nick{font-weight:700;font-size:14px;}
  .msg-time{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  .msg-text{font-size:14.5px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .msg-file{
    margin-top:4px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:10px;
    overflow:hidden;
    max-width:320px;
  }
  .msg-file img{width:100%;display:block;max-height:280px;object-fit:cover;cursor:pointer;}
  .msg-file-link{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;color:var(--text);text-decoration:none;
  }
  .msg-file-link:hover{background:var(--panel-2);}
  .file-ext{
    background:var(--red);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;padding:4px 6px;border-radius:5px;
  }
  .msg-pin-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:12px;padding:2px 4px;border-radius:5px;line-height:1;
  }
  .msg-pin-btn:hover{color:var(--text);background:var(--panel-2);}
  .msg-pin-btn.pinned{color:#e8b13f;}
  .msg.is-pinned .msg-text{
    background:rgba(232,177,63,.08);border-left:2px solid #e8b13f;
    padding:6px 8px;border-radius:0 6px 6px 0;
  }
  .msg-expiry-note{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .empty-state{
    margin:auto;text-align:center;color:var(--muted);
  }
  .empty-state .big{
    font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;
    color:var(--panel-2);
  }

  /* ---------- INPUT BAR ---------- */
  #composer{
    border-top:1px solid var(--border);
    background:#0d0d0f;
    padding:14px 20px;
    display:flex;
    align-items:flex-end;
    gap:10px;
    flex-shrink:0;
  }
  #preview-row{
    display:flex;gap:8px;padding:0 20px;flex-wrap:wrap;
  }
  .preview-chip{
    background:var(--panel);border:1px solid var(--red);
    border-radius:8px;padding:6px 10px;font-size:12px;
    display:flex;align-items:center;gap:8px;color:var(--text);
  }
  .preview-chip button{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;
  }
  #text-input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:10px;
    resize:none;
    max-height:140px;
    outline:none;
  }
  #text-input:focus{border-color:var(--red);}
  #send-btn{
    background:var(--red);border:none;color:#fff;
    width:44px;height:44px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:.15s;
  }
  #send-btn:hover{background:var(--red-bright);}
  #send-btn:disabled{opacity:.4;cursor:default;}
  #file-input{display:none;}

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--red);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:80vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:600px){
    .brand-mark{font-size:20px;}
    #messages{padding:14px;}
    #composer{padding:10px 14px;}
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div class="screen" id="auth-screen">
  <div class="card">
    <div style="text-align:center;margin-bottom:18px;"><span class="brand-mark">NEXUS<span>CHAT</span></span></div>
    <h2 id="auth-title">เข้าสู่ระบบ</h2>
    <div class="auth-error hidden" id="auth-error"></div>
    <div class="field" id="login-username-field">
      <label>ชื่อผู้ใช้</label>
      <input id="auth-username" autocomplete="username" placeholder="ชื่อผู้ใช้ของคุณ">
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input id="auth-password" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร">
    </div>
    <button class="btn-primary" id="auth-submit">เข้าสู่ระบบ</button>
    <div class="switch-line" id="auth-switch-line">
      ยังไม่มีบัญชี? <button id="auth-switch-btn">สมัครสมาชิก</button>
    </div>
  </div>
</div>

<!-- ================= LOBBY SCREEN ================= -->
<div class="screen hidden" id="lobby-screen">
  <div class="lobby-top">
    <div class="lobby-user">
      <span class="mini-avatar" id="lobby-avatar" style="background:#8a3238">--</span>
      <span id="lobby-username">-</span>
    </div>
    <button class="logout-btn" id="logout-btn">ออกจากระบบ</button>
  </div>
  <div class="lobby-grid">
    <div class="lobby-card">
      <h3>สร้างห้องใหม่</h3>
      <div class="row">
        <input id="create-room-name" placeholder="ชื่อห้อง เช่น ห้องคุยเล่น" style="font-family:'Inter',sans-serif;letter-spacing:0;">
        <button id="create-room-btn">สร้าง</button>
      </div>
    </div>
    <div class="lobby-card">
      <h3>เข้าร่วมด้วยโค้ด</h3>
      <div class="row">
        <input id="join-room-code" placeholder="เช่น FC45JK" maxlength="8" style="text-transform:uppercase;">
        <button id="join-room-btn">เข้าร่วม</button>
      </div>
    </div>
  </div>
  <div class="recent-title">ห้องล่าสุดของคุณ</div>
  <div class="recent-list" id="recent-list">
    <div class="empty-recent">ยังไม่เคยเข้าห้องไหนเลย — สร้างหรือเข้าร่วมห้องด้านบนได้เลย</div>
  </div>
</div>

<!-- ================= CHAT SCREEN ================= -->
<div class="hidden" id="chat-screen">
  <header>
    <div class="brand">
      <button class="back-btn" id="back-to-lobby-btn" title="กลับหน้าหลัก">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="brand-mark" id="chat-room-name">NEXUS<span>CHAT</span></span>
      <div class="room-chip" id="room-chip">ROOM · ------</div>
    </div>
    <div class="header-right">
      <button class="invite-btn" id="invite-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
        คัดลอกลิงก์เชิญ
      </button>
    </div>
  </header>

  <div id="voice-bar">
    <div class="voice-label"><span class="voice-dot"></span>ห้องเสียง <span id="voice-count">(0)</span></div>
    <div id="voice-members"></div>
    <button id="voice-mute-btn" title="ปิด/เปิดไมค์">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    </button>
    <button id="voice-join-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      <span id="voice-join-label">เข้าร่วมเสียง</span>
    </button>
  </div>

  <div id="messages">
    <div class="empty-state">
      <div class="big">0000</div>
      <div>ยังไม่มีข้อความในห้องนี้ — เริ่มคุยกันได้เลย</div>
    </div>
  </div>

  <div id="preview-row"></div>
  <div id="composer">
    <button class="icon-btn" id="attach-btn" title="แนบไฟล์/รูป">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
    </button>
    <input type="file" id="file-input" multiple>
    <textarea id="text-input" placeholder="พิมพ์ข้อความ..." rows="1"></textarea>
    <button id="send-btn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
    </button>
  </div>
</div>

<div id="toast"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
// ===== ตั้งค่า Supabase ของคุณตรงนี้ (Project Settings > API) =====
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// อายุข้อความข้อความล้วน (ไม่มีรูป/ไฟล์แนบ และไม่ได้ถูกกดให้จำ) ก่อนถูกลบอัตโนมัติ
const MESSAGE_TTL_MS = 24 * 60 * 60 * 1000; // 24 ชั่วโมง

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
const AVATAR_COLORS = ['#8a3238','#b3474e','#3f6bae','#3fae6a','#ae8f3f','#7a3fae','#3faeae'];
function colorFor(str){
  let h=0; for(const c of (str||'?')) h = c.charCodeAt(0) + ((h<<5)-h);
  return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length];
}

// ================= AUTH =================
const authScreen = document.getElementById('auth-screen');
const lobbyScreen = document.getElementById('lobby-screen');
const chatScreen = document.getElementById('chat-screen');
const authTitle = document.getElementById('auth-title');
const authError = document.getElementById('auth-error');
const authSubmit = document.getElementById('auth-submit');
const authSwitchLine = document.getElementById('auth-switch-line');
const usernameInput = document.getElementById('auth-username');
const passwordInput = document.getElementById('auth-password');

let authMode = 'login'; // or 'signup'
let myUid = null;
let myNick = null;

// Supabase Auth's email/password provider needs an email-shaped string.
// We derive one from the username behind the scenes so people never see or type an email.
function usernameToFakeEmail(username){
  const slug = username.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_');
  return `${slug}@nexuschat.local`;
}

authSubmit.onclick = async ()=>{
  const username = usernameInput.value.trim();
  const password = passwordInput.value;
  authError.classList.add('hidden');
  if(!username || !password){ showAuthError('กรอกชื่อผู้ใช้และรหัสผ่านให้ครบ'); return; }
  const fakeEmail = usernameToFakeEmail(username);
  authSubmit.disabled = true;
  try{
    if(authMode === 'signup'){
      const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
      if(error) throw error;
      if(!data.user) throw { message: 'กรุณายืนยันอีเมล (ปิด Confirm email ใน Supabase Auth settings เพื่อข้ามขั้นตอนนี้)' };
      const { error: profErr } = await sb.from('profiles').insert({ id: data.user.id, username });
      if(profErr) throw profErr;
      // signUp บางครั้งไม่สร้าง session ทันที ถ้ายังไม่ login ให้ลอง sign in ต่อ
      if(!data.session){
        const { error: signInErr } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
        if(signInErr) throw signInErr;
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
      if(error) throw error;
    }
  }catch(err){
    showAuthError(translateAuthError(err));
  }
  authSubmit.disabled = false;
};
function showAuthError(msg){
  authError.textContent = msg;
  authError.classList.remove('hidden');
}
function translateAuthError(err){
  const msg = (err && (err.message || err.error_description || '')) || '';
  if(/already registered|already exists|duplicate/i.test(msg)) return 'ชื่อผู้ใช้นี้มีคนใช้แล้ว ลองชื่ออื่น หรือเข้าสู่ระบบแทน';
  if(/invalid.*email/i.test(msg)) return 'ชื่อผู้ใช้มีตัวอักษรที่ใช้ไม่ได้ ลองใช้ตัวอักษร/ตัวเลขภาษาอังกฤษ';
  if(/password.*(short|least|weak)/i.test(msg)) return 'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัว)';
  if(/invalid login credentials/i.test(msg)) return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if(msg) return msg;
  return 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
}

// Pending room to auto-join after login (from ?room= link)
const params = new URLSearchParams(location.search);
const pendingRoomFromLink = params.get('room');

async function handleSession(session){
  const user = session ? session.user : null;
  if(user){
    myUid = user.id;
    const { data: profile } = await sb.from('profiles').select('username').eq('id', user.id).single();
    myNick = profile ? profile.username : (user.email||'').split('@')[0];
    authScreen.classList.add('hidden');
    document.getElementById('lobby-avatar').textContent = myNick.slice(0,2).toUpperCase();
    document.getElementById('lobby-avatar').style.background = colorFor(myNick);
    document.getElementById('lobby-username').textContent = myNick;
    subscribeRecentRooms();
    if(pendingRoomFromLink){
      openRoom(pendingRoomFromLink, null);
    } else {
      lobbyScreen.classList.remove('hidden');
    }
  } else {
    myUid = null; myNick = null;
    lobbyScreen.classList.add('hidden');
    chatScreen.classList.add('hidden');
    authScreen.classList.remove('hidden');
  }
}
sb.auth.getSession().then(({data})=> handleSession(data.session));
sb.auth.onAuthStateChange((_event, session)=> handleSession(session));

let recentChannel = null;
async function subscribeRecentRooms(){
  if(recentChannel){ sb.removeChannel(recentChannel); recentChannel = null; }
  await refreshRecentRooms();
  recentChannel = sb.channel('user-rooms-'+myUid)
    .on('postgres_changes', { event:'*', schema:'public', table:'user_rooms', filter:`user_id=eq.${myUid}` },

async function refreshRecentRooms(){
  const { data, error } = await sb.from('user_rooms')
    .select('room_id,name,ts').eq('user_id', myUid)
    .order('ts',{ascending:false}).limit(15);

// ================= ROOM / CHAT =================
let roomId = null;
let messagesChannel = null;
let purgeInterval = null;

async function openRoom(id, knownName){
  roomId = id.toUpperCase();
  const url = new URL(location.href);
  url.searchParams.set('room', roomId);
  history.replaceState({}, '', url);

  let name = knownName;
  if(!name){
    const { data: d, error } = await sb.from('rooms').select('name').eq('id', roomId).single();
    if(error || !d){
      showToast('ไม่พบห้องนี้ ตรวจสอบโค้ดอีกครั้ง');
      url.searchParams.delete('room');
      history.replaceState({}, '', url);
      lobbyScreen.classList.remove('hidden');
      return;
    }
    name = d.name;
    await sb.from('user_rooms').upsert({ user_id: myUid, room_id: roomId, name, ts: new Date().toISOString() });
  }

  document.getElementById('chat-room-name').innerHTML = (name||'NEXUS') + '<span></span>';
  document.getElementById('room-chip').textContent = 'ROOM · ' + roomId;
  lobbyScreen.classList.add('hidden');
  chatScreen.classList.remove('hidden');
  subscribeMessages();
}

document.getElementById('back-to-lobby-btn').onclick = ()=>{
  if(inVoice) leaveVoice();
  if(messagesChannel){ sb.removeChannel(messagesChannel); messagesChannel = null; }
  if(purgeInterval){ clearInterval(purgeInterval); purgeInterval = null; }
  chatScreen.classList.add('hidden');
  const url = new URL(location.href);
  url.searchParams.delete('room');
  history.replaceState({}, '', url);
  lobbyScreen.classList.remove('hidden');
};

// ---------- MESSAGES ----------
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const fileInput = document.getElementById('file-input');
const previewRow = document.getElementById('preview-row');
let pendingFiles = [];

textInput.addEventListener('input', ()=>{
  textInput.style.height='auto';
  textInput.style.height = Math.min(textInput.scrollHeight,140)+'px';
  updateSendState();
});
textInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById('attach-btn').onclick = ()=> fileInput.click();
fileInput.addEventListener('change', ()=>{
  pendingFiles = [...pendingFiles, ...fileInput.files];
  renderPreviews();
  fileInput.value='';
});
function renderPreviews(){
  previewRow.innerHTML='';
  pendingFiles.forEach((f,i)=>{
    const chip = document.createElement('div');
    chip.className='preview-chip';
    chip.innerHTML = `<span>📎 ${f.name}</span>`;
    const btn = document.createElement('button');
    btn.textContent='✕';
    btn.onclick=()=>{ pendingFiles.splice(i,1); renderPreviews(); updateSendState(); };
    chip.appendChild(btn);
    previewRow.appendChild(chip);
  });
  updateSendState();
}
function updateSendState(){
  sendBtn.disabled = !(textInput.value.trim() || pendingFiles.length);
}
sendBtn.onclick = sendMessage;

async function sendMessage(){
  const text = textInput.value.trim();
  const files = [...pendingFiles];
  if(!text && !files.length) return;
  textInput.value=''; textInput.style.height='auto';
  pendingFiles = []; renderPreviews();
  sendBtn.disabled = true;

  const attachments = [];
  for(const f of files){
    try{
      const path = `${roomId}/${Date.now()}_${f.name}`;
      const { error: upErr } = await sb.storage.from('uploads').upload(path, f);
      if(upErr) throw upErr;
      const { data: pub } = sb.storage.from('uploads').getPublicUrl(path);
      attachments.push({url: pub.publicUrl, name:f.name, type:f.type});
    }catch(err){
      console.error(err);
      showToast('อัปโหลดไฟล์ล้มเหลว: '+f.name);
    }
  }

  await sb.from('messages').insert({
    room_id: roomId,
    nick: myNick,
    text: text,
    attachments: attachments,
    has_attachment: attachments.length > 0,
    color: colorFor(myNick),
    pinned: false
  });
}

// ข้อความข้อความล้วน (ไม่มีไฟล์แนบ) ที่ยังไม่ถูกกด "จำ" และเก่ากว่า MESSAGE_TTL_MS จะถูกลบทิ้ง
// การลบนี้ทำงานฝั่ง client เมื่อมีคนเปิดห้องอยู่ (เว็บนี้ host แบบ static ไม่มีเซิร์ฟเวอร์ตัวเอง)
async function purgeExpiredMessages(){
  const cutoff = new Date(Date.now() - MESSAGE_TTL_MS).toISOString();
  await sb.from('messages').delete()
    .eq('room_id', roomId)
    .eq('pinned', false)
    .eq('has_attachment', false)
    .lt('created_at', cutoff);
}

async function subscribeMessages(){
  if(messagesChannel){ sb.removeChannel(messagesChannel); messagesChannel = null; }
  if(purgeInterval){ clearInterval(purgeInterval); purgeInterval = null; }

  await purgeExpiredMessages();
  await loadAndRenderMessages();

  messagesChannel = sb.channel('messages-'+roomId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`room_id=eq.${roomId}` },
      payload=>{
        if(messagesEl.querySelector(`[data-id="${payload.new.id}"]`)) return;
        const emptyState = messagesEl.querySelector('.empty-state');
        if(emptyState) emptyState.remove();
        messagesEl.appendChild(renderMessage(payload.new));
        scrollBottom();
      })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages', filter:`room_id=eq.${roomId}` },
      payload=>{
        const row = messagesEl.querySelector(`[data-id="${payload.new.id}"]`);
        if(row) row.replaceWith(renderMessage(payload.new));
      })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'messages', filter:`room_id=eq.${roomId}` },
      payload=>{
        const row = messagesEl.querySelector(`[data-id="${payload.old.id}"]`);
        if(row) row.remove();
        if(!messagesEl.children.length){
          messagesEl.innerHTML = `<div class="empty-state"><div class="big">0000</div><div>ยังไม่มีข้อความในห้องนี้ — เริ่มคุยกันได้เลย</div></div>`;
        }
      })
    .subscribe();

  // เผื่อไว้ ลองล้างข้อความหมดอายุซ้ำทุก 5 นาทีระหว่างที่ยังเปิดห้องอยู่
  purgeInterval = setInterval(async ()=>{
    await purgeExpiredMessages();
  }, 5*60*1000);
}

async function loadAndRenderMessages(){
  const { data, error } = await sb.from('messages')
    .select('*').eq('room_id', roomId).order('created_at',{ascending:true});
  messagesEl.innerHTML='';
  if(error || !data || !data.length){
    messagesEl.innerHTML = `<div class="empty-state"><div class="big">0000</div><div>ยังไม่มีข้อความในห้องนี้ — เริ่มคุยกันได้เลย</div></div>`;
    return;
  }
  data.forEach(m=> messagesEl.appendChild(renderMessage(m)));
  scrollBottom();
}

function scrollBottom(){
  requestAnimationFrame(()=>{ messagesEl.scrollTop = messagesEl.scrollHeight; });
}

async function togglePin(id, currentlyPinned){
  await sb.from('messages').update({ pinned: !currentlyPinned }).eq('id', id);
}

function renderMessage(m){
  const row = document.createElement('div');
  row.className = 'msg' + (m.pinned ? ' is-pinned' : '');
  row.dataset.id = m.id;

  const avatar = document.createElement('div');
  avatar.className='avatar';
  avatar.style.background = m.color || '#8a3238';
  avatar.textContent = (m.nick||'?').slice(0,2).toUpperCase();

  const body = document.createElement('div');
  body.className='msg-body';

  const meta = document.createElement('div');
  meta.className='msg-meta';
  const nickEl = document.createElement('span');
  nickEl.className='msg-nick';
  nickEl.style.color = m.color || '#fff';
  nickEl.textContent = m.nick || 'ไม่ทราบชื่อ';
  const timeEl = document.createElement('span');
  timeEl.className='msg-time';
  timeEl.textContent = m.created_at ? new Date(m.created_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';
  meta.appendChild(nickEl); meta.appendChild(timeEl);

  const pinBtn = document.createElement('button');
  pinBtn.className = 'msg-pin-btn' + (m.pinned ? ' pinned' : '');
  pinBtn.title = m.pinned ? 'เลิกจำข้อความนี้' : 'กดให้จำข้อความนี้ไว้ (ไม่ให้หายใน 24 ชม.)';
  pinBtn.textContent = m.pinned ? '★ จำแล้ว' : '☆ จำ';
  pinBtn.onclick = ()=> togglePin(m.id, m.pinned);
  meta.appendChild(pinBtn);

  body.appendChild(meta);

  if(m.text){
    const textEl = document.createElement('div');
    textEl.className='msg-text';
    textEl.textContent = m.text;
    body.appendChild(textEl);
  }

  if(!m.pinned && !m.has_attachment){
    const noteEl = document.createElement('div');
    noteEl.className='msg-expiry-note';
    noteEl.textContent = 'ข้อความนี้จะหายไปภายใน 24 ชม. หากไม่ถูกกดให้จำ';
    body.appendChild(noteEl);
  }

  (m.attachments||[]).forEach(att=>{
    const card = document.createElement('div');
    card.className='msg-file';
    if(att.type && att.type.startsWith('image/')){
      const img = document.createElement('img');
      img.src = att.url;
      img.onclick = ()=> window.open(att.url,'_blank');
      card.appendChild(img);
    } else {
      const ext = (att.name.split('.').pop()||'FILE').toUpperCase().slice(0,4);
      card.innerHTML = `<a class="msg-file-link" href="${att.url}" target="_blank" download>
        <span class="file-ext">${ext}</span><span>${att.name}</span>
      </a>`;
    }
    body.appendChild(card);
  });

  row.appendChild(avatar);
  row.appendChild(body);
  return row;
}

// ================= VOICE CHANNEL (WebRTC mesh) =================
const ICE_CONFIG = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }
]};
const myPeerId = 'p_' + Math.random().toString(36).slice(2,10);
let localStream = null;
let inVoice = false;
let isMuted = false;
const peerConnections = {};
const remoteAudioEls = {};
const analysers = {};
let voicePeersChannel = null;
let voiceSignalsChannel = null;
let speakingInterval = null;
let heartbeatInterval = null;
let cleanupInterval = null;
let voicePeersMap = new Map();

const voiceJoinBtn = document.getElementById('voice-join-btn');
const voiceJoinLabel = document.getElementById('voice-join-label');
const voiceMuteBtn = document.getElementById('voice-mute-btn');
const voiceMembersEl = document.getElementById('voice-members');

voiceJoinBtn.onclick = ()=> inVoice ? leaveVoice() : joinVoice();
voiceMuteBtn.onclick = toggleMute;

async function joinVoice(){
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(err){
    showToast('เปิดไมค์ไม่ได้ — ตรวจสอบสิทธิ์การใช้ไมโครโฟน');
    return;
  }
  inVoice = true;
  voiceJoinBtn.classList.add('active');
  voiceJoinLabel.textContent = 'ออกจากเสียง';
  voiceMuteBtn.style.display = 'flex';
  setupLocalAnalyser();

  const { data: existing } = await sb.from('voice_peers').select('*').eq('room_id', roomId);
  voicePeersMap = new Map();
  const existingIds = new Set((existing||[]).map(p=>p.peer_id));
  (existing||[]).forEach(p=> voicePeersMap.set(p.peer_id, p));

  const nowIso = new Date().toISOString();
  await sb.from('voice_peers').upsert({ room_id: roomId, peer_id: myPeerId, nick: myNick, color: colorFor(myNick), ts: nowIso });
  voicePeersMap.set(myPeerId, { room_id: roomId, peer_id: myPeerId, nick: myNick, color: colorFor(myNick), ts: nowIso });
  renderVoiceMembers();

  voicePeersChannel = sb.channel('voice-peers-'+roomId)
    .on('postgres_changes', { event:'*', schema:'public', table:'voice_peers', filter:`room_id=eq.${roomId}` },
      payload=>{
        if(payload.eventType === 'DELETE'){
          const pid = payload.old.peer_id;
          if(pid === myPeerId) return;
          if(voicePeersMap.has(pid)){
            voicePeersMap.delete(pid);
            closePeerConnection(pid);
            playLeaveSound();
          }
        } else {
          const p = payload.new;
          const isNew = !voicePeersMap.has(p.peer_id);
          voicePeersMap.set(p.peer_id, p);
          if(p.peer_id !== myPeerId && isNew && !peerConnections[p.peer_id]){
            createPeerConnection(p.peer_id, existingIds.has(p.peer_id));
            playJoinSound();
          }
        }
        renderVoiceMembers();
      })
    .subscribe();

  voiceSignalsChannel = sb.channel('voice-signals-'+roomId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'voice_signals', filter:`room_id=eq.${roomId}` },
      async payload=>{
        const row = payload.new;
        if(row.to_peer !== myPeerId) return;
        await handleSignal({ from: row.from_peer, type: row.type, payload: row.payload });
        sb.from('voice_signals').delete().eq('id', row.id).then(()=>{});
      })
    .subscribe();

  speakingInterval = setInterval(updateSpeakingIndicators, 200);
  heartbeatInterval = setInterval(()=>{
    sb.from('voice_peers').update({ ts: new Date().toISOString() }).eq('room_id', roomId).eq('peer_id', myPeerId).then(()=>{});
  }, 15000);
  cleanupInterval = setInterval(cleanupStalePeers, 10000);
  playJoinSound();
  showToast('เข้าร่วมห้องเสียงแล้ว');
}

function cleanupStalePeers(){
  const now = Date.now();
  voicePeersMap.forEach((p, pid)=>{
    if(pid === myPeerId) return;
    if(p.ts && (now - new Date(p.ts).getTime()) > 45000){
      sb.from('voice_peers').delete().eq('room_id', roomId).eq('peer_id', pid).then(()=>{});
    }
  });
}

async function leaveVoice(){
  playLeaveSound();
  inVoice = false;
  voiceJoinBtn.classList.remove('active');
  voiceJoinLabel.textContent = 'เข้าร่วมเสียง';
  voiceMuteBtn.style.display = 'none';
  voiceMuteBtn.classList.remove('muted');
  isMuted = false;

  Object.keys(peerConnections).forEach(closePeerConnection);
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  localStream = null;

  if(voicePeersChannel){ sb.removeChannel(voicePeersChannel); voicePeersChannel = null; }
  if(voiceSignalsChannel){ sb.removeChannel(voiceSignalsChannel); voiceSignalsChannel = null; }
  if(speakingInterval) clearInterval(speakingInterval);
  if(heartbeatInterval) clearInterval(heartbeatInterval);
  if(cleanupInterval) clearInterval(cleanupInterval);
  voicePeersMap = new Map();
  voiceMembersEl.innerHTML = '';
  document.getElementById('voice-count').textContent = '(0)';

  try{ await sb.from('voice_peers').delete().eq('room_id', roomId).eq('peer_id', myPeerId); }catch(e){}
}

function toggleMute(){
  if(!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t=> t.enabled = !isMuted);
  voiceMuteBtn.classList.toggle('muted', isMuted);
}

function createPeerConnection(peerId, iAmInitiator){
  const pc = new RTCPeerConnection(ICE_CONFIG);
  peerConnections[peerId] = pc;

  localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));

  pc.onicecandidate = e=>{
    if(e.candidate) sendSignal(peerId, 'candidate', JSON.stringify(e.candidate));
  };
  pc.ontrack = e=>{
    let audioEl = remoteAudioEls[peerId];
    if(!audioEl){
      audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      document.body.appendChild(audioEl);
      remoteAudioEls[peerId] = audioEl;
    }
    audioEl.srcObject = e.streams[0];
    setupRemoteAnalyser(peerId, e.streams[0]);
  };

  if(iAmInitiator){
    pc.onnegotiationneeded = async ()=>{
      try{
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal(peerId, 'offer', JSON.stringify(offer));
      }catch(e){ console.error(e); }
    };
  }
  return pc;
}

function closePeerConnection(peerId){
  const pc = peerConnections[peerId];
  if(pc){ pc.close(); delete peerConnections[peerId]; }
  const audioEl = remoteAudioEls[peerId];
  if(audioEl){ audioEl.remove(); delete remoteAudioEls[peerId]; }
  delete analysers[peerId];
}

function sendSignal(to, type, payload){
  sb.from('voice_signals').insert({
    room_id: roomId, from_peer: myPeerId, to_peer: to, type, payload
  }).then(()=>{});
}

async function handleSignal(data){
  const { from, type, payload } = data;
  let pc = peerConnections[from];
  if(!pc) pc = createPeerConnection(from, false);
  if(type === 'offer'){
    await pc.setRemoteDescription(JSON.parse(payload));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(from, 'answer', JSON.stringify(answer));
  } else if(type === 'answer'){
    await pc.setRemoteDescription(JSON.parse(payload));
  } else if(type === 'candidate'){
    try{ await pc.addIceCandidate(JSON.parse(payload)); }catch(e){}
  }
}

function renderVoiceMembers(){
  voiceMembersEl.innerHTML = '';
  document.getElementById('voice-count').textContent = `(${voicePeersMap.size})`;
  voicePeersMap.forEach((d, pid)=>{
    const chip = document.createElement('div');
    chip.className = 'voice-chip';
    chip.dataset.peerId = pid;
    chip.innerHTML = `<span class="mini-avatar" style="background:${d.color||'#8a3238'}">${(d.nick||'?').slice(0,2).toUpperCase()}</span><span>${d.nick||'ไม่ทราบชื่อ'}${pid===myPeerId?' (คุณ)':''}</span>`;
    voiceMembersEl.appendChild(chip);
  });
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function setupLocalAnalyser(){
  if(!localStream) return;
  const ctx = getAudioCtx();
  const source = ctx.createMediaStreamSource(localStream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  analysers[myPeerId] = { analyser, data: new Uint8Array(analyser.frequencyBinCount) };
}
function setupRemoteAnalyser(peerId, stream){
  const ctx = getAudioCtx();
  const source = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  analysers[peerId] = { analyser, data: new Uint8Array(analyser.frequencyBinCount) };
}
function updateSpeakingIndicators(){
  Object.keys(analysers).forEach(peerId=>{
    const { analyser, data } = analysers[peerId];
    analyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0) / data.length;
    const chip = voiceMembersEl.querySelector(`[data-peer-id="${peerId}"]`);
    if(chip) chip.classList.toggle('speaking', avg > 12);
  });
}

function playTone(freq, dur, delay=0){
  setTimeout(()=>{
    try{
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur/1000);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur/1000 + 0.02);
    }catch(e){}
  }, delay);
}
function playJoinSound(){ playTone(587,110,0); playTone(880,140,90); }
function playLeaveSound(){ playTone(880,110,0); playTone(523,160,90); }

window.addEventListener('pagehide', ()=>{
  if(inVoice){ sb.from('voice_peers').delete().eq('room_id', roomId).eq('peer_id', myPeerId).then(()=>{}); }
});
</script>
